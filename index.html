<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#142c35" />
    <meta
      name="description"
      content="An offline isometric fantasy RTS. Command the frontier, build an army, and claim the ancient relics."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" />
    <title>Frontier Command</title>
  </head>
  <body style="margin: 0; background: #142c35; color: #edf3de">
    <div id="battlefield"></div>
    <div id="ui">
      <main
        id="boot-loading"
        style="
          font: 18px system-ui;
          padding: 32px;
          max-width: 580px;
          margin: 10vh auto;
        "
      >
        <h1>Frontier Command</h1>
        <p id="boot-status" role="status">Preparing your frontier…</p>
        <button
          id="boot-repair"
          hidden
          style="
            font: inherit;
            background: #e7c57b;
            color: #142c35;
            padding: 16px;
            border: 0;
            border-radius: 6px;
          "
        >
          Repair &amp; restart
        </button>
      </main>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="update" hidden>
      Update available <button id="apply-update">Update &amp; Restart</button
      ><button id="dismiss-update" aria-label="Dismiss update notification">
        ×
      </button>
    </div>
    <script>
      const startupFailure = () => {
        const button = document.getElementById("boot-repair");
        if (!button) return;
        document.getElementById("boot-status").textContent =
          "The game could not load its application files. Repair the offline shell to restart. Your saves will be preserved.";
        button.hidden = false;
      };
      window.addEventListener("error", startupFailure, true);
      setTimeout(startupFailure, 8000);
      document.getElementById("boot-repair").onclick = async () => {
        const button = document.getElementById("boot-repair");
        button.disabled = true;
        try {
          const r = await navigator.serviceWorker.getRegistration();
          if (r) {
            await r.update();
            if (!r.waiting && r.installing)
              await new Promise((resolve) =>
                r.installing.addEventListener("statechange", () => {
                  if (r.waiting) resolve();
                }),
              );
            if (r.waiting) {
              navigator.serviceWorker.addEventListener(
                "controllerchange",
                () => location.reload(),
                { once: true },
              );
              r.waiting.postMessage({ type: "APPLY_UPDATE" });
              return;
            }
          }
          location.reload();
        } catch (e) {
          document.getElementById("boot-status").textContent =
            "Could not repair while offline. Reconnect once and try again. Your saves are preserved.";
          button.disabled = false;
        }
      };
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
